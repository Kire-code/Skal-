<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Golfferðin – nóvember 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F8F4; --card:#FFFFFF; --soft:#ECF0EA; --ink:#13284A; --muted:#5A6A80; --line:#D6DCE2;
  --fairway:#2D6B42; --fairway-ink:#FFFFFF; --flag:#F0BF2C; --over:#B6432C; --over2:#7E2A1A;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E192B; --card:#15233A; --soft:#1B2C47; --ink:#E9EEF6; --muted:#9AA9BF; --line:#2A3B57;
    --fairway:#5DB37A; --fairway-ink:#0E192B; --flag:#F2C94C; --over:#EB7C61; --over2:#FFB3A1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E192B; --card:#15233A; --soft:#1B2C47; --ink:#E9EEF6; --muted:#9AA9BF; --line:#2A3B57;
  --fairway:#5DB37A; --fairway-ink:#0E192B; --flag:#F2C94C; --over:#EB7C61; --over2:#FFB3A1;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
.cond{font-stretch:68%}
h1,h2,h3{margin:0;line-height:1.1}
h2{font-size:1.5rem;font-weight:800;font-stretch:78%;margin:28px 0 12px}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* Hero: next tee */
.hero{padding:26px 0 20px;border-bottom:2px solid var(--ink)}
.hero .lbl{font-size:.95rem;color:var(--muted);margin-bottom:6px}
.hero .time{font-size:clamp(5rem,26vw,9.5rem);font-weight:800;font-stretch:62%;line-height:.82;letter-spacing:-.02em;display:flex;align-items:flex-end;gap:14px}
.hero .pin{width:clamp(28px,8vw,46px);height:clamp(56px,16vw,92px);position:relative;flex:none;margin-bottom:6px}
.hero .pin::before{content:"";position:absolute;left:0;bottom:0;width:3px;height:100%;background:var(--ink)}
.hero .pin::after{content:"";position:absolute;left:3px;top:0;width:85%;height:42%;background:var(--flag);clip-path:polygon(0 0,100% 50%,0 100%)}
.hero .where{font-size:1.6rem;font-weight:700;font-stretch:85%;margin-top:12px}
.hero .when{color:var(--muted);margin-top:2px}

/* Schedule */
.day{display:grid;grid-template-columns:62px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.day:hover .course{text-decoration:underline}
.day .d{text-align:center}
.day .d .n{font-size:2.6rem;font-weight:800;font-stretch:62%;line-height:.9}
.day .d .w{font-size:.85rem;color:var(--muted)}
.day .course{font-size:1.2rem;font-weight:700}
.day .meta{color:var(--muted);font-size:.9rem;margin-top:2px}
.fmt{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:999px;font-size:.85rem;font-weight:600;background:var(--soft)}
.fmt.real{background:var(--fairway);color:var(--fairway-ink)}
.fmt.fun{background:var(--flag);color:#1A1A1A}
.day.past{opacity:.6}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px 12px;text-decoration:none;color:var(--muted);font-size:.74rem;font-weight:600}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--ink)}
nav.tabs a[aria-current="page"] svg{color:var(--fairway)}

/* Score view */
.rpick{display:flex;gap:8px;overflow-x:auto;padding:16px 0 6px;scrollbar-width:none}
.rpick::-webkit-scrollbar{display:none}
.rpick button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;text-align:left;min-width:92px}
.rpick button b{display:block;font-stretch:75%;font-size:1.05rem}
.rpick button span{font-size:.78rem;color:var(--muted)}
.rpick button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.rpick button[aria-pressed="true"] span{color:inherit;opacity:.75}
.rhead{padding:10px 0 4px}
.rhead h1{font-size:1.9rem;font-weight:800;font-stretch:75%}
.rule{background:var(--soft);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:.93rem}
.notice{border-left:4px solid var(--flag);background:var(--card);padding:10px 14px;margin:12px 0;font-size:.92rem;border-radius:0 10px 10px 0}
.banner{background:var(--over);color:#fff;padding:10px 14px;border-radius:10px;margin:12px 0;font-size:.92rem}

.hole{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:10px}
.hole .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hole .num{font-size:3.2rem;font-weight:800;font-stretch:62%;line-height:.9}
.hole .num small{font-size:1rem;font-weight:600;font-stretch:100%;color:var(--muted);display:block}
.nav-btn{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);font-size:1.4rem;line-height:1}
.hinfo{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0 6px;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 12px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.hinfo label{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.hinfo select{border:1.5px solid var(--line);border-radius:10px;background:var(--paper);padding:6px 8px;font-weight:700}
.prow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.pname{font-weight:700;font-size:1.05rem}
.dots{color:var(--fairway);letter-spacing:2px;font-size:.8rem}
.step{display:flex;align-items:center;gap:6px}
.step button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-size:1.4rem;font-weight:700;line-height:1}
.step .v{width:46px;height:44px;border:0;background:none;text-align:center;font-size:1.7rem;font-weight:800;font-stretch:70%}
.step .v.empty{color:var(--muted);font-size:1rem;font-weight:600;font-stretch:100%}
.pts{min-width:54px;text-align:right;font-weight:700;font-stretch:80%}
.pts small{display:block;font-weight:500;color:var(--muted);font-size:.75rem;font-stretch:100%}

details.hcp{margin:14px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
details.hcp summary{padding:10px 0;font-weight:700;cursor:pointer}
.hcpgrid{display:grid;grid-template-columns:1fr 90px;gap:8px 12px;align-items:center;padding-bottom:12px}
.hcpgrid input{width:90px;padding:8px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);text-align:center;font-weight:700}

.sc-wrap{overflow-x:auto;margin:14px -18px 0;padding:0 18px}
table.sc{border-collapse:collapse;font-size:.85rem;min-width:100%}
table.sc th,table.sc td{border:1px solid var(--line);padding:0;text-align:center;min-width:30px;height:32px}
table.sc th{background:var(--soft);font-weight:700;font-stretch:80%}
table.sc td.nm,table.sc th.nm{text-align:left;padding:0 8px;white-space:nowrap;position:sticky;left:0;background:var(--card);z-index:1}
table.sc th.nm{background:var(--soft)}
table.sc td.tot{font-weight:800;background:var(--soft)}
table.sc tr.cur-col td.on, table.sc .on{outline:2px solid var(--ink);outline-offset:-2px}
table.sc td button{all:unset;display:block;width:100%;height:32px;line-height:32px;cursor:pointer;font-weight:700}
.sb{display:inline-block;width:24px;height:24px;line-height:22px;border-radius:50%}
.s-under{border:2px solid var(--fairway);color:var(--fairway)}
.s-eagle{background:var(--fairway);color:var(--fairway-ink);border-radius:50%}
.s-bogey{color:var(--over)}
.s-dbl{color:var(--over2);font-weight:800;text-decoration:underline}

.result{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 16px 12px}
.result h3{font-size:1.1rem;font-weight:800;margin:12px 0 4px}
.rrow{display:grid;grid-template-columns:28px 1fr auto auto;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.rrow .pos{font-weight:800;font-stretch:70%;font-size:1.2rem;color:var(--muted)}
.rrow .val{font-weight:800;font-stretch:75%;font-size:1.2rem}
.rrow .aw{font-size:.8rem;color:var(--muted);min-width:56px;text-align:right}
.extra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:.92rem}
.extra select{border:1.5px solid var(--line);border-radius:10px;background:var(--paper);padding:6px 8px}

/* Leaderboard */
.lb{margin-top:10px}
.lbrow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.lbrow .rank{font-size:2.4rem;font-weight:800;font-stretch:62%;line-height:1}
.lbrow:first-child .rank{color:var(--fairway)}
.lbrow .who{font-size:1.25rem;font-weight:700}
.lbrow .tot{font-size:2.4rem;font-weight:800;font-stretch:62%;line-height:1}
.lbrow .bars{display:flex;gap:3px;margin-top:6px}
.lbrow .bars i{display:block;width:22px;height:6px;border-radius:2px;background:var(--line)}
.lbrow .bars i.f{background:var(--fairway)}
table.grid{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}
table.grid th,table.grid td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}
table.grid th:first-child,table.grid td:first-child{text-align:left}
table.grid th{font-weight:700;font-stretch:80%;color:var(--muted)}

/* Info */
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.fact b{display:block;font-size:1.8rem;font-weight:800;font-stretch:65%;line-height:1.05}
.players{display:grid;gap:0}
.players div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.compose{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.compose textarea{width:100%;min-height:76px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);padding:10px;resize:vertical}
.who-pick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.who-pick button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-weight:600}
.who-pick button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn{border:0;background:var(--fairway);color:var(--fairway-ink);border-radius:12px;padding:10px 16px;font-weight:700}
.note{padding:12px 0;border-bottom:1px solid var(--line)}
.note .h{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;color:var(--muted)}
.note .h b{color:var(--ink)}
.note p{margin:4px 0 0;white-space:pre-wrap}
.note .del{border:0;background:none;color:var(--muted);font-size:.8rem;text-decoration:underline}
ul.pts-list{padding-left:18px;margin:6px 0}
ul.pts-list li{margin:4px 0}
/* Side games */
.addbtn{width:100%;border:2px dashed var(--line);background:none;border-radius:14px;padding:14px;font-weight:700;font-size:1.05rem;margin-top:6px}
.newgame{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.newgame input{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chips button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:.88rem}
.game{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:12px}
.game .gh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.game .gn{font-size:1.25rem;font-weight:800;font-stretch:80%}
.game .tots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.game .tots div{background:var(--soft);border-radius:10px;padding:6px 4px;text-align:center;font-size:.8rem;color:var(--muted)}
.game .tots b{display:block;font-size:1.4rem;font-weight:800;font-stretch:65%;color:var(--ink);line-height:1.1}
.game .tots .lead b{color:var(--fairway)}
.play{border-top:1px solid var(--line);margin-top:12px;padding-top:4px}
.btn2{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 14px;font-weight:700}
.row-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
details.hist{margin-top:10px;font-size:.9rem}
details.hist summary{cursor:pointer;color:var(--muted);font-weight:600;padding:4px 0}
.hrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:.82rem;padding:0}
.linkbtn.danger{color:var(--over)}
/* Course reviews */
.stars{display:flex;gap:2px;margin:6px 0 10px}
.stars button{border:0;background:none;font-size:2rem;line-height:1;padding:2px 4px;color:var(--line)}
.stars button[aria-pressed="true"]{color:var(--flag)}
#rv{width:100%;min-height:70px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);padding:10px;resize:vertical}
.rev{padding:10px 0;border-top:1px solid var(--line)}
.rev .h{display:flex;justify-content:space-between;gap:8px;font-size:.9rem}
.rev .st{color:var(--flag);letter-spacing:1px}
.rev p{margin:4px 0 0;white-space:pre-wrap}
.avg{font-size:.95rem;margin-bottom:6px}
.avg .st{color:var(--flag);letter-spacing:1px}
.crank{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.crank .st{color:var(--flag)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const COURSES={

};
const FORMATS={

};
const ROUNDS=[

  {id:'r6',date:'2026-11-06',wd:'fös',time:'10:20',course:'lasramblas',fmt:'stableford',title:'Lokahringurinn',double:true,buggies:'2 golfbílar',price:462,extra:'Næstur holu á par 3'}
];

function teeUTC(r){const [y,m,d]=r.date.split('-').map(Number);const [h,mi]=r.time.split(':').map(Number);return Date.UTC(y,m-1,d,h-1,mi);} // CET = UTC+1 in Nov
function madridDate(){try{return new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Madrid'});}catch(e){return new Date().toISOString().slice(0,10);}}

/* ---------- state ---------- */
const state={cards:{},courses:{},extras:{},notes:[],games:{},plays:{},reviews:{}};
let db=null, readOnly=false, dbFailed=false, writeError=false;
const pending={};
const ui={view:'dagskra',round:defaultRound(),hole:1,author:null,newGame:false,draft:null,rv:null};
try{ui.author=localStorage.getItem('golf26-author');}catch(e){}

function defaultRound(){
  const today=madridDate();
  const r=ROUNDS.find(r=>r.date>=today);
  return r?r.id:'r6';
}
function entities(r){
  if(r.fmt==='scramble') return r.teams.map((t,i)=>({id:'t'+i,name:t.map(id=>P[id].name).join(' & '),members:t}));
  return PLAYERS.map(p=>({id:p.id,name:p.name,members:[p.id]}));
}
function defaultPh(r,e){
  if(r.fmt==='scramble'){const h=e.members.map(id=>Math.round(P[id].idx));return Math.round(0.35*Math.min(...h)+0.15*Math.max(...h));}
  const full=Math.round(P[e.id].idx);
  return r.fmt==='fourball'?Math.round(full*0.85):full;
}
function card(r,e){
  const c=state.cards[r.id+'_'+e.id];
  return {strokes:(c&&Array.isArray(c.strokes)?c.strokes:Array(18).fill(null)).map(v=>v==null?null:Number(v)),ph:(c&&c.ph!=null)?Number(c.ph):defaultPh(r,e)};
}
function course(id){
  const c=state.courses[id];
  if(c&&Array.isArray(c.par)&&Array.isArray(c.si)) return {par:c.par.map(Number),si:c.si.map(Number),ok:!!c.ok};
  return {par:Array(18).fill(4),si:Array.from({length:18},(_,i)=>i+1),ok:false};
}
function rec(ph,si){if(ph<0)return 0;return Math.floor(ph/18)+((ph%18)>=si?1:0);}
function stb(g,par,r){return g==null?null:Math.max(0,par+r-g+2);}

/* ---------- scoring ---------- */
function rankAward(list,higherBetter){
  // list: [{id,v}] -> {id:points} using 4/3/2/1 split on ties
  const pts=[4,3,2,1];const out={};
  const s=[...list].sort((a,b)=>higherBetter?b.v-a.v:a.v-b.v);
  let i=0;
  while(i<s.length){let j=i;while(j+1<s.length&&s[j+1].v===s[i].v)j++;
    let sum=0;for(let k=i;k<=j;k++)sum+=pts[k]||0;const each=sum/(j-i+1);
    for(let k=i;k<=j;k++)out[s[k].id]=each;i=j+1;}
  return out;
}
function roundResult(r){
  const c=course(r.course), ents=entities(r);
  const res={rows:[],awards:{},started:false,complete:false,unit:''};
  const cards=Object.fromEntries(ents.map(e=>[e.id,card(r,e)]));
  const anyEntered=ents.some(e=>cards[e.id].strokes.some(v=>v!=null));
  res.started=anyEntered;
  res.complete=ents.every(e=>cards[e.id].strokes.every(v=>v!=null));
  const mult=r.double?2:1;
  if(r.fmt==='stableford'){
    res.unit='punktar';
    ents.forEach(e=>{const cd=cards[e.id];let t=0,n=0,g=0;cd.strokes.forEach((s,h)=>{if(s!=null){t+=stb(s,c.par[h],rec(cd.ph,c.si[h]));n++;g+=s;}});res.rows.push({id:e.id,name:e.name,v:t,sub:n?`${n} holur, ${g} högg`:'ekki byrjaður'});});
    if(anyEntered){const a=rankAward(res.rows,true);for(const k in a)res.awards[k]=a[k]*mult;}
    res.rows.sort((a,b)=>b.v-a.v);
  }
  if(r.fmt==='fourball'){
    res.unit='punktar';
    const teams=r.teams.map((t,i)=>{let tot=0,n=0;for(let h=0;h<18;h++){const vals=t.map(id=>{const cd=cards[id];const s=cd.strokes[h];return s==null?null:stb(s,c.par[h],rec(cd.ph,c.si[h]));}).filter(v=>v!=null);if(vals.length){tot+=Math.max(...vals);n++;}}return {id:'t'+i,name:t.map(id=>P[id].name).join(' & '),v:tot,sub:n?`${n} holur`:'ekki byrjaðir',members:t};});
    res.rows=teams.sort((a,b)=>b.v-a.v);
    if(anyEntered) teamAward(res,teams,true,mult);
  }
  if(r.fmt==='scramble'){
    res.unit='nettó';
    const teams=ents.map(e=>{const cd=cards[e.id];let rel=0,n=0,g=0;cd.strokes.forEach((s,h)=>{if(s!=null){rel+=s-rec(cd.ph,c.si[h])-c.par[h];n++;g+=s;}});return {id:e.id,name:e.name,v:rel,disp:n?(rel===0?'E':(rel>0?'+'+rel:String(rel))):'–',sub:n?`${n} holur, ${g} högg brúttó`:'ekki byrjaðir',members:e.members,n};});
    res.rows=[...teams].sort((a,b)=>(b.n?1:0)-(a.n?1:0)||a.v-b.v);
    if(anyEntered) teamAward(res,teams,false,mult);
  }
  if(r.fmt==='skins'){
    res.unit='skins';
    const won=Object.fromEntries(ents.map(e=>[e.id,0]));let carry=0;const holes=[];
    for(let h=0;h<18;h++){
      const nets=ents.map(e=>{const cd=cards[e.id];const s=cd.strokes[h];return s==null?null:{id:e.id,n:s-rec(cd.ph,c.si[h])};});
      if(nets.some(x=>x==null)){holes.push(null);continue;}
      const m=Math.min(...nets.map(x=>x.n));const w=nets.filter(x=>x.n===m);
      carry+=1;
      if(w.length===1){won[w[0].id]+=carry;holes.push({w:w[0].id,v:carry});carry=0;}else holes.push({w:null,v:0});
    }
    res.carry=carry;res.holes=holes;
    res.rows=ents.map(e=>({id:e.id,name:e.name,v:won[e.id],sub:''})).sort((a,b)=>b.v-a.v);
    if(holes.some(x=>x)){const a=rankAward(res.rows,true);for(const k in a)res.awards[k]=a[k]*mult;}
  }
  const ex=state.extras[r.id];
  if(ex&&ex.winner&&P[ex.winner]) res.awards[ex.winner]=(res.awards[ex.winner]||0)+1;
  return res;
}
function teamAward(res,teams,higherBetter,mult){
  const [a,b]=teams;let wa=2,wb=2;
  if(a.v!==b.v){const aWins=higherBetter?a.v>b.v:a.v<b.v;wa=aWins?3:1;wb=aWins?1:3;}
  a.members.forEach(id=>res.awards[id]=wa*mult);b.members.forEach(id=>res.awards[id]=wb*mult);
  a.aw=wa*mult;b.aw=wb*mult;
}

/* ---------- persistence ---------- */
/* Allt er geymt í símanum fyrst (localStorage) og sent í gagnagrunninn þegar net er til staðar.
   Óvistaðar breytingar bíða í "outbox" sem lifir af endurhleðslu og netleysi. */
const OUTBOX_KEY='golf26-outbox';
let outbox={};try{outbox=JSON.parse(localStorage.getItem(OUTBOX_KEY)||'{}')||{};}catch(e){outbox={};}
let flushing=false,flushTimer=null,localLoaded=false;
function saveLocal(){try{localStorage.setItem('golf26-state',JSON.stringify({cards:state.cards,courses:state.courses,extras:state.extras,notes:state.notes,games:state.games,plays:state.plays,reviews:state.reviews}));localStorage.setItem(OUTBOX_KEY,JSON.stringify(outbox));}catch(e){}}
function loadLocal(){if(localLoaded)return;localLoaded=true;try{const s=JSON.parse(localStorage.getItem('golf26-state')||'null');if(s){for(const k in s){if(k in state)state[k]=s[k];}}}catch(e){}}
function unsynced(){return Object.keys(outbox).length;}
function queueWrite(col,id,data){outbox[col+'/'+id]={col,id,data,op:'upsert'};saveLocal();updateSyncUI();scheduleFlush(400);}
function queueDelete(col,id){outbox[col+'/'+id]={col,id,op:'delete'};saveLocal();updateSyncUI();scheduleFlush(100);}
function scheduleFlush(ms){clearTimeout(flushTimer);flushTimer=setTimeout(flush,ms);}
async function flush(){
  if(!db||flushing||!unsynced())return;
  if(navigator.onLine===false){updateSyncUI();return;}
  flushing=true;
  try{
    for(const key of Object.keys(outbox)){
      const it=outbox[key];let res;
      try{res=it.op==='delete'?await db.from('golf26').delete().eq('col',it.col).eq('id',it.id):await db.from('golf26').upsert({col:it.col,id:it.id,data:it.data,updated_at:new Date().toISOString()});}catch(e){res={error:e};}
      if(res&&res.error){writeError=true;break;}
      if(outbox[key]===it)delete outbox[key];
      writeError=false;dbFailed=false;
    }
  }finally{flushing=false;saveLocal();updateSyncUI();}
  if(unsynced()&&!writeError)scheduleFlush(300);
}
setInterval(()=>{if(unsynced())flush();},15000);
function syncHTML(){
  const n=unsynced();
  if(n) return `<div id="sync" class="notice">⏳ ${n} ${n===1?'breyting bíður':'breytingar bíða'} eftir netsambandi. Þær eru geymdar í símanum og sendast sjálfkrafa um leið og netið kemur.</div>`;
  if(dbFailed) return `<div id="sync" class="notice">Ekkert netsamband núna. Allt sem þú skráir geymist í símanum og sendist þegar netið kemur aftur.</div>`;
  return `<div id="sync" class="small muted" style="margin:8px 0">✓ Allt vistað og samstillt</div>`;
}
function updateSyncUI(){const el=document.getElementById('sync');if(el)el.outerHTML=syncHTML();}
function setStroke(r,e,h,val){
  const c=card(r,e);c.strokes[h]=val;
  state.cards[r.id+'_'+e.id]={strokes:c.strokes,ph:c.ph,_t:Date.now()};
  queueWrite('cards',r.id+'_'+e.id,state.cards[r.id+'_'+e.id]);
}
function setPh(r,e,ph){
  const c=card(r,e);c.ph=ph;state.cards[r.id+'_'+e.id]={strokes:c.strokes,ph,_t:Date.now()};
  queueWrite('cards',r.id+'_'+e.id,state.cards[r.id+'_'+e.id]);
}
function setCourse(id,patch){
  const c=course(id);const n={par:c.par,si:c.si,ok:true,...patch,_t:Date.now()};state.courses[id]=n;queueWrite('courses',id,n);
}

function applyRow(col,id,data,deleted){
  if(col==='notes'){
    if(outbox['notes/'+id])return;
    state.notes=state.notes.filter(n=>n.id!==id);
    if(!deleted&&data)state.notes.push({id,...data});
    return;
  }
  if(!state[col]||outbox[col+'/'+id])return;
  // aldrei skrifa eldri útgáfu yfir nýrri (hægt net / seinkuð rauntímaskilaboð)
  const cur=state[col][id];
  if(!deleted&&cur&&cur._t&&(!data||!data._t||data._t<cur._t))return;
  if(deleted)delete state[col][id];else state[col][id]=data;
}
async function loadAll(){
  if(!db)return;
  let res;try{res=await db.from('golf26').select('col,id,data');}catch(e){res={error:e};}
  if(res.error){dbFailed=true;updateSyncUI();return;}
  dbFailed=false;
  const seen=new Set(res.data.map(r=>r.col+'/'+r.id));
  res.data.forEach(r=>applyRow(r.col,r.id,r.data,false));
  // fjarlægja það sem aðrir eyddu, en aldrei óvistaðar breytingar úr þessum síma
  for(const col of ['games','plays','reviews','extras'])for(const id of Object.keys(state[col]))if(!seen.has(col+'/'+id)&&!outbox[col+'/'+id])delete state[col][id];
  state.notes=state.notes.filter(n=>seen.has('notes/'+n.id)||outbox['notes/'+n.id]);
  saveLocal();render();flush();
}
function loadSupabaseLib(){return new Promise(res=>{if(window.supabase)return res(true);const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';sc.onload=()=>res(true);sc.onerror=()=>res(false);document.head.appendChild(sc);});}
let connecting=false;
async function connect(){
  loadLocal();render();
  if(db||connecting)return;
  if(SUPABASE_URL.includes('XXXX')){dbFailed=true;updateSyncUI();return;}
  connecting=true;
  const ok=window.supabase||await loadSupabaseLib();
  connecting=false;
  if(!ok){dbFailed=true;updateSyncUI();return;}
  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  await loadAll();
  db.channel('golf26').on('postgres_changes',{event:'*',schema:'public',table:'golf26'},payload=>{
    if(payload.eventType==='DELETE'){const o=payload.old||{};applyRow(o.col,o.id,null,true);}
    else{const n=payload.new;applyRow(n.col,n.id,n.data,false);}
    saveLocal();render();
  }).subscribe();
}
// símar sofna og missa net: sækja og senda aftur þegar síðan vaknar eða netið kemur
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(db){flush();loadAll();}else connect();}});
window.addEventListener('online',()=>{writeError=false;if(db){flush();loadAll();}else connect();});
window.addEventListener('offline',()=>{dbFailed=true;updateSyncUI();});

/* ---------- rendering ---------- */
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dayNum(r){return Number(r.date.slice(8));}
function fmtChip(r){const f=FORMATS[r.fmt];return `<span class="fmt ${f.kind}">${f.name}${r.double?', tvöföld stig':''}</span>`;}

function countdown(ms){
  const m=Math.round(ms/60000);if(m<60)return `eftir ${m} mín.`;
  const h=Math.floor(m/60);if(h<24)return `eftir ${h} klst. ${m%60} mín.`;
  const d=Math.floor(h/24);return `eftir ${d} ${d===1?'dag':'daga'} og ${h%24} klst.`;
}
function heroHTML(){
  const now=Date.now();
  const next=ROUNDS.find(r=>teeUTC(r)+5*3600e3>now);
  if(!next){
    const lb=leaderboard();const w=lb[0];
    return `<section class="hero"><div class="lbl">Ferðinni er lokið</div><div class="time"><span class="pin" aria-hidden="true"></span>${esc(w.name)}</div><div class="where">vann bikarinn með ${fmtNum(w.total)} stig</div></section>`;
  }
  const diff=teeUTC(next)-now;
  const when=diff>0?countdown(diff):'Í gangi núna';
  return `<section class="hero"><div class="lbl">Næsti teigur</div><div class="time"><span class="pin" aria-hidden="true"></span><span>${next.time}</span></div><div class="where">${COURSES[next.course]}</div><div class="when">${next.wd}. ${dayNum(next)}. ${MONTH}, ${when}. ${FORMATS[next.fmt].name}.</div></section>`;
}
function renderSchedule(){
  const now=Date.now();
  const total=ROUNDS.reduce((s,r)=>s+r.price,0);
  app.innerHTML=heroHTML()+`<h2>Dagskráin</h2>`+ROUNDS.map(r=>{
    const past=teeUTC(r)+6*3600e3<now;
    const teams=r.teams?`<div class="meta">${r.teams.map(t=>t.map(id=>P[id].name).join(' & ')).join(' gegn ')}</div>`:'';
    return `<button class="day ${past?'past':''}" data-go="${r.id}"><div class="d"><div class="n">${dayNum(r)}</div><div class="w">${r.wd}.</div></div><div><div class="course">${COURSES[r.course]}, kl. ${r.time}</div><div class="meta">${esc(r.title)}. ${r.buggies}. ${r.price} € fyrir hópinn.</div>${teams}${avgStars(r.course)?`<div class="meta avg">${avgLine(r.course)}</div>`:''}${fmtChip(r)}</div></button>`;
  }).join('')+`<p class="muted small" style="margin-top:14px">Vallargjöld samtals ${total.toLocaleString('is-IS')} €, sem gerir ${(total/4).toLocaleString('is-IS')} € á mann. Rástímar eru staðartími á Spáni.</p>`;
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ui.round=b.dataset.go;ui.hole=firstOpenHole(R[ui.round]);location.hash='skor';});
}
function firstOpenHole(r){const es=entities(r);for(let h=0;h<18;h++){if(es.some(e=>card(r,e).strokes[h]==null))return h+1;}return 18;}

function scoreClass(g,par,recv){if(g==null)return'';const d=g-recv-par;if(d<=-2)return's-eagle';if(d===-1)return's-under';if(d===1)return's-bogey';if(d>=2)return's-dbl';return'';}

function renderScore(){
  const r=R[ui.round], c=course(r.course), ents=entities(r), f=FORMATS[r.fmt];
  const h=ui.hole-1;
  const res=roundResult(r);
  let html=`<div class="rpick" role="group" aria-label="Veldu hring">${ROUNDS.map(x=>`<button aria-pressed="${x.id===r.id}" data-r="${x.id}"><b>${dayNum(x)}. ${MONTH}</b><span>${COURSES[x.course]}</span></button>`).join('')}</div>`;
  html+=`<div class="rhead"><h1>${COURSES[r.course]}</h1><div class="muted">${r.wd}. ${dayNum(r)}. ${MONTH} kl. ${r.time}. ${esc(r.title)}.</div>${fmtChip(r)}</div>`;
  html+=`<div class="rule">${f.rule}${r.double?' Á lokadeginum gilda tvöföld stig í bikarnum.':''}</div>`;
  html+=syncHTML();
  if(!c.ok) html+=`<div class="notice">Stilltu par og holuforgjöf (HCP) fyrir hverja holu af skorkortinu. Punktar og nettóskor reiknast rétt þegar það er komið, og stillingin gildir fyrir alla.</div>`;

  html+=`<section class="hole" aria-label="Hola ${ui.hole}"><div class="top"><button class="nav-btn" data-hole="-1" aria-label="Fyrri hola">‹</button><div class="num" style="text-align:center"><small>Hola</small>${ui.hole}</div><button class="nav-btn" data-hole="1" aria-label="Næsta hola">›</button></div>`;
  html+=`<div class="hinfo"><div class="seg" role="group" aria-label="Par">${[3,4,5].map(p=>`<button data-par="${p}" aria-pressed="${c.par[h]===p}">Par ${p}</button>`).join('')}</div><label>HCP <select data-si>${Array.from({length:18},(_,i)=>`<option ${c.si[h]===i+1?'selected':''}>${i+1}</option>`).join('')}</select></label></div>`;
  ents.forEach(e=>{
    const cd=card(r,e), g=cd.strokes[h], rv=rec(cd.ph,c.si[h]);
    let right='';
    if(r.fmt==='scramble'||r.fmt==='skins'){right=g==null?'':`${g-rv} <small>nettó</small>`;}
    else{right=g==null?'':`${stb(g,c.par[h],rv)} <small>punktar</small>`;}
    html+=`<div class="prow"><div><div class="pname">${esc(e.name)}</div><div class="dots" title="Högg í forgjöf á holu">${'●'.repeat(rv)}<span class="muted small" style="letter-spacing:0">${rv?` ${rv} í forgjöf`:'ekkert högg í forgjöf'}</span></div></div>
      <div class="step"><button data-st="${e.id}" data-d="-1" aria-label="Færri högg hjá ${esc(e.name)}" ${readOnly?'disabled':''}>−</button><button class="v ${g==null?'empty':''}" data-st="${e.id}" data-d="0" aria-label="Högg hjá ${esc(e.name)}" ${readOnly?'disabled':''}>${g==null?'Skrá':g}</button><button data-st="${e.id}" data-d="1" aria-label="Fleiri högg hjá ${esc(e.name)}" ${readOnly?'disabled':''}>+</button></div>
      <div class="pts">${right}</div></div>`;
  });
  html+=`</section>`;

  html+=`<details class="hcp"><summary>Leikforgjöf í þessum hring</summary><div class="hcpgrid">${ents.map(e=>`<label for="ph-${e.id}">${esc(e.name)}${r.fmt==='scramble'?'':` <span class="muted small">(${String(P[e.id].idx).replace('.',',')})</span>`}</label><input id="ph-${e.id}" type="number" inputmode="numeric" min="0" max="60" value="${card(r,e).ph}" data-ph="${e.id}" ${readOnly?'disabled':''}>`).join('')}</div><p class="muted small" style="margin:0 0 12px">Sjálfgefið er reiknað út frá forgjöf. Ef skorkortið eða teigtaflan gefur aðra vallarforgjöf, leiðréttu hér.</p></details>`;

  // scorecard table
  const cols=[...Array(9).keys()].map(i=>i).concat(['out']).concat([...Array(9).keys()].map(i=>i+9)).concat(['in','tot']);
  const sumRange=(arr,a,b)=>arr.slice(a,b).reduce((s,v)=>s+(v||0),0);
  html+=`<div class="sc-wrap"><table class="sc"><thead><tr><th class="nm">Hola</th>${cols.map(k=>typeof k==='number'?`<th class="${k===h?'on':''}">${k+1}</th>`:`<th>${k==='out'?'Út':k==='in'?'Inn':'Alls'}</th>`).join('')}</tr></thead><tbody>`;
  html+=`<tr><td class="nm muted">Par</td>${cols.map(k=>typeof k==='number'?`<td>${c.par[k]}</td>`:`<td class="tot">${k==='out'?sumRange(c.par,0,9):k==='in'?sumRange(c.par,9,18):sumRange(c.par,0,18)}</td>`).join('')}</tr>`;
  html+=`<tr><td class="nm muted">HCP</td>${cols.map(k=>typeof k==='number'?`<td class="muted">${c.si[k]}</td>`:`<td class="tot"></td>`).join('')}</tr>`;
  ents.forEach(e=>{
    const cd=card(r,e);
    html+=`<tr><td class="nm"><b>${esc(e.name)}</b></td>${cols.map(k=>{
      if(typeof k==='number'){const g=cd.strokes[k];return `<td class="${k===h?'on':''}"><button data-jump="${k+1}" aria-label="Hola ${k+1}">${g==null?'':`<span class="sb ${scoreClass(g,c.par[k],rec(cd.ph,c.si[k]))}">${g}</span>`}</button></td>`;}
      const a=k==='out'?0:k==='in'?9:0,b=k==='out'?9:18;return `<td class="tot">${sumRange(cd.strokes,a,b)||''}</td>`;
    }).join('')}</tr>`;
    if(r.fmt==='stableford'||r.fmt==='fourball'){
      html+=`<tr><td class="nm muted small">punktar</td>${cols.map(k=>{
        if(typeof k==='number'){const g=cd.strokes[k];return `<td class="muted">${g==null?'':stb(g,c.par[k],rec(cd.ph,c.si[k]))}</td>`;}
        const a=k==='out'?0:k==='in'?9:0,b=k==='out'?9:18;let s=0;for(let i=a;i<b;i++){const g=cd.strokes[i];if(g!=null)s+=stb(g,c.par[i],rec(cd.ph,c.si[i]));}return `<td class="tot">${s||''}</td>`;
      }).join('')}</tr>`;
    }
  });
  if(r.fmt==='skins'){
    html+=`<tr><td class="nm muted small">skin</td>${cols.map(k=>{if(typeof k!=='number')return '<td class="tot"></td>';const x=res.holes[k];return `<td class="small">${x?(x.w?esc(P[x.w].name.slice(0,2))+(x.v>1?'×'+x.v:''):'=') :''}</td>`;}).join('')}</tr>`;
  }
  html+=`</tbody></table></div>`;

  // result
  html+=`<section class="result"><h3>${res.complete?'Úrslit':'Staðan í hringnum'}</h3>`;
  res.rows.forEach((row,i)=>{
    const aw=r.fmt==='fourball'||r.fmt==='scramble'?row.aw:res.awards[row.id];
    const val=row.disp!=null?row.disp:row.v;
    html+=`<div class="rrow"><div class="pos">${i+1}</div><div><b>${esc(row.name)}</b>${row.sub?`<div class="muted small">${row.sub}</div>`:''}</div><div class="val">${val} <span class="muted small" style="font-weight:500">${res.unit}</span></div><div class="aw">${res.started&&aw!=null?`${fmtNum(aw)} stig${res.complete?'':' (í gangi)'}`:''}</div></div>`;
  });
  if(r.fmt==='skins'&&res.carry) html+=`<p class="muted small">${res.carry} ${res.carry===1?'skin bíður':'skins bíða'} á næstu holu.</p>`;
  const ex=state.extras[r.id]||{};
  html+=`<div class="extra"><label for="ex">Aukaverðlaun, ${esc(r.extra.charAt(0).toLowerCase()+r.extra.slice(1))} (1 stig):</label><select id="ex" ${readOnly?'disabled':''}><option value="">Enginn ennþá</option>${PLAYERS.map(p=>`<option value="${p.id}" ${ex.winner===p.id?'selected':''}>${p.name}</option>`).join('')}</select></div></section>`;
  html+=reviewSection(r.course);

  app.innerHTML=html;
  bindReview(r.course,renderScore);
  const cur=app.querySelector('.rpick [aria-pressed="true"]');cur&&cur.scrollIntoView({block:'nearest',inline:'center'});

  app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ui.round=b.dataset.r;ui.hole=firstOpenHole(R[ui.round]);render();});
  app.querySelectorAll('[data-hole]').forEach(b=>b.onclick=()=>{ui.hole=Math.min(18,Math.max(1,ui.hole+Number(b.dataset.hole)));render();});
  app.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{ui.hole=Number(b.dataset.jump);render();app.querySelector('.hole').scrollIntoView({behavior:'smooth',block:'start'});});
  app.querySelectorAll('[data-par]').forEach(b=>b.onclick=()=>{if(readOnly)return;const p=course(r.course).par.slice();p[h]=Number(b.dataset.par);setCourse(r.course,{par:p});render();});
  const si=app.querySelector('[data-si]');si.onchange=()=>{if(readOnly)return;const s=course(r.course).si.slice();s[h]=Number(si.value);setCourse(r.course,{si:s});render();};
  app.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{
    const e=ents.find(x=>x.id===b.dataset.st);const g=card(r,e).strokes[h];const d=Number(b.dataset.d);const par=course(r.course).par[h];
    let v;if(g==null)v=d<0?par-1:(d>0?par+1:par);else if(d===0)return;else v=g+d;
    if(v<1)v=null;if(v>15)v=15;
    setStroke(r,e,h,v);render();
  });
  app.querySelectorAll('[data-ph]').forEach(inp=>inp.onchange=()=>{const e=ents.find(x=>x.id===inp.dataset.ph);const v=Math.max(0,Math.min(60,Math.round(Number(inp.value)||0)));setPh(r,e,v);render();});
  const exSel=app.querySelector('#ex');exSel.onchange=()=>{state.extras[r.id]={winner:exSel.value||null};queueWrite('extras',r.id,state.extras[r.id]);render();};
}

function fmtNum(n){return Number.isInteger(n)?String(n):n.toFixed(1).replace('.',',');}
function leaderboard(){
  const tot=Object.fromEntries(PLAYERS.map(p=>[p.id,{id:p.id,name:p.name,total:0,per:{}}]));
  ROUNDS.forEach(r=>{const res=roundResult(r);for(const k in res.awards){tot[k].total+=res.awards[k];tot[k].per[r.id]=res.awards[k];}});
  const sp=sidePoints();for(const k in sp){tot[k].total+=sp[k];tot[k].side=sp[k];}
  return Object.values(tot).sort((a,b)=>b.total-a.total);
}
function renderStandings(){
  const lb=leaderboard();
  const max=Math.max(1,...lb.map(x=>x.total));
  let html=`<h2 style="margin-top:26px">Bikarinn</h2><p class="muted small" style="margin:-4px 0 6px">Stig safnast í hverjum hring. Sá sem er efstur eftir Las Ramblas tekur bikarinn heim.</p><div class="lb">`;
  let lastV=null,lastRank=0;
  lb.forEach((x,i)=>{const rank=x.total===lastV?lastRank:i+1;lastV=x.total;lastRank=rank;
    html+=`<div class="lbrow"><div class="rank">${rank}</div><div><div class="who">${esc(x.name)}</div><div class="bars" aria-hidden="true">${ROUNDS.map(r=>`<i class="${x.per[r.id]!=null?'f':''}" title="${COURSES[r.course]}"></i>`).join('')}</div></div><div class="tot">${fmtNum(x.total)}</div></div>`;});
  html+=`</div><h2>Stig eftir dögum</h2><div class="sc-wrap"><table class="grid"><thead><tr><th>Dagur</th>${PLAYERS.map(p=>`<th>${p.name}</th>`).join('')}</tr></thead><tbody>`;
  ROUNDS.forEach(r=>{const res=roundResult(r);html+=`<tr><td>${dayNum(r)}. ${COURSES[r.course]}<div class="muted small">${FORMATS[r.fmt].name}${r.double?', tvöföld':''}</div></td>${PLAYERS.map(p=>`<td>${res.awards[p.id]!=null?fmtNum(res.awards[p.id]):'–'}</td>`).join('')}</tr>`;});
  if(Object.keys(state.plays).length){html+=`<tr><td>Aukaleikir<div class="muted small">${Object.keys(state.games).length} leikir</div></td>${PLAYERS.map(p=>{const v=lb.find(x=>x.id===p.id).side||0;return `<td>${fmtNum(v)}</td>`;}).join('')}</tr>`;}
  html+=`</tbody></table></div>`;
  html+=`<h2>Svona gefast stigin</h2><ul class="pts-list"><li>Einstaklingshringir og skins: 4 stig fyrir 1. sæti, 3 fyrir 2., 2 fyrir 3. og 1 fyrir 4. Jöfn sæti skipta stigunum á milli sín.</li><li>Liðahringir: 3 stig á hvorn í sigurliðinu, 1 á hvorn í hinu, 2 á alla ef jafnt.</li><li>Aukaverðlaun dagsins gefa 1 stig.</li><li>Lokahringurinn á Las Ramblas gefur tvöföld stig.</li><li>Stig úr aukaleikjum (Leikir-flipinn) bætast beint við.</li></ul>`;
  app.innerHTML=html;
}

  html+=`<h2>Bjórinn</h2><p>Á 19. holu skráum við bjórana í <a href="https://kire-code.github.io/Skal-/" target="_blank" rel="noopener" style="color:var(--fairway);font-weight:700">Skál</a>. Gefðu einkunn og sjáðu hvað hinir fengu sér.</p>`;
  html+=`<h2>Kylfingarnir</h2><div class="players">${PLAYERS.map(p=>`<div><b>${p.name}</b><span class="muted">forgjöf ${String(p.idx).replace('.',',')}</span></div>`).join('')}</div>`;
  html+=`<h2>Tilkynningatafla</h2><div class="compose"><label for="nt" class="small muted">Kvöldmatur, akstur, hver skuldar hverjum bjór…</label><textarea id="nt" placeholder="Skrifa skilaboð" ${readOnly?'disabled':''}></textarea><div class="who-pick" role="group" aria-label="Hver skrifar">${PLAYERS.map(p=>`<button data-au="${p.id}" aria-pressed="${ui.author===p.id}">${p.name}</button>`).join('')}</div><button class="btn" id="post" ${readOnly?'disabled':''}>Setja inn</button></div>`;
  const notes=[...state.notes].sort((a,b)=>(b.at||0)-(a.at||0));
  html+=notes.length?notes.map(n=>`<div class="note"><div class="h"><span><b>${esc(P[n.by]?.name||'Einhver')}</b>, ${new Date(n.at).toLocaleString('is-IS',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span><button class="del" data-del="${esc(n.id)}" ${readOnly?'disabled':''}>Eyða</button></div><p>${esc(n.text)}</p></div>`).join(''):`<p class="muted">Engin skilaboð ennþá. Settu inn það fyrsta, til dæmis hvar þið borðið í kvöld.</p>`;
  app.innerHTML=html;
  app.querySelectorAll('[data-au]').forEach(b=>b.onclick=()=>{ui.author=b.dataset.au;try{localStorage.setItem('golf26-author',ui.author);}catch(e){}renderInfo();});
  app.querySelector('#post').onclick=async()=>{
    const t=app.querySelector('#nt').value.trim();if(!t)return;
    const by=ui.author||'erik';const n={text:t.slice(0,2000),by,at:Date.now()};
    const id=(crypto.randomUUID?crypto.randomUUID():'n'+Date.now()+Math.random().toString(36).slice(2));
    state.notes.push({id,...n});
    queueWrite('notes',id,n);
    render();
  };
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{

/* ---------- course reviews ---------- */
function reviewsFor(cid){return Object.entries(state.reviews).filter(([id,r])=>r&&r.course===cid&&P[r.by]).map(([id,r])=>({id,...r})).sort((a,b)=>(b.at||0)-(a.at||0));}
function avgStars(cid){const l=reviewsFor(cid).filter(r=>r.stars);if(!l.length)return null;return {avg:l.reduce((s,r)=>s+r.stars,0)/l.length,n:l.length};}
function starStr(n){const k=Math.round(n);return '★'.repeat(k)+'☆'.repeat(5-k);}
function avgLine(cid){const a=avgStars(cid);return a?`<span class="st">${starStr(a.avg)}</span> ${a.avg.toFixed(1).replace('.',',')} (${a.n} ${a.n===1?'umsögn':'umsagnir'})`:'';}
function reviewSection(cid){
  const me=ui.author, mine=me?state.reviews[cid+'_'+me]:null;
  if(!ui.rv||ui.rv.course!==cid||ui.rv.by!==me) ui.rv={course:cid,by:me,stars:mine?mine.stars:0,text:mine?mine.text||'':''};
  let h=`<section class="result"><h3>Umsögn um ${COURSES[cid]}</h3>`;
  const al=avgLine(cid); if(al) h+=`<div class="avg">${al}</div>`;
  h+=`<div class="who-pick" role="group" aria-label="Hver ert þú">${PLAYERS.map(p=>`<button data-rau="${p.id}" aria-pressed="${me===p.id}">${p.name}</button>`).join('')}</div>`;
  if(!me) h+=`<p class="muted small">Veldu nafnið þitt til að gefa vellinum einkunn.</p>`;
  else{
    h+=`<div class="stars" role="group" aria-label="Einkunn">${[1,2,3,4,5].map(n=>`<button data-star="${n}" aria-pressed="${n<=ui.rv.stars}" aria-label="${n} stjörnur">★</button>`).join('')}</div>`;
    h+=`<label for="rv" class="small muted">Hvað fannst þér? Flatir, brautir, útsýni, barinn…</label><textarea id="rv" maxlength="1000">${esc(ui.rv.text)}</textarea>`;
    h+=`<div class="row-btns"><button class="btn" id="rvsave">${mine?'Uppfæra umsögn':'Vista umsögn'}</button>${mine?'<button class="btn2" id="rvdel">Eyða minni</button>':''}</div>`;
  }
  const list=reviewsFor(cid);
  if(list.length) h+=`<div style="margin-top:12px">${list.map(r=>`<div class="rev"><div class="h"><b>${esc(P[r.by].name)}</b><span class="st">${starStr(r.stars||0)}</span></div>${r.text?`<p>${esc(r.text)}</p>`:''}</div>`).join('')}</div>`;
  return h+`</section>`;
}
function bindReview(cid,rerender){
  app.querySelectorAll('[data-rau]').forEach(b=>b.onclick=()=>{ui.author=b.dataset.rau;try{localStorage.setItem('golf26-author',ui.author);}catch(e){}ui.rv=null;rerender();});
  app.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{ui.rv.stars=Number(b.dataset.star);rerender();});
  const ta=app.querySelector('#rv');if(ta)ta.oninput=()=>{ui.rv.text=ta.value;};
  const sv=app.querySelector('#rvsave');if(sv)sv.onclick=()=>{
    if(!ui.rv.stars){alert('Veldu fjölda stjarna fyrst.');return;}
    const id=cid+'_'+ui.author;const now=Date.now();
    state.reviews[id]={course:cid,by:ui.author,stars:ui.rv.stars,text:(ui.rv.text||'').trim().slice(0,1000),at:now,_t:now};
    queueWrite('reviews',id,state.reviews[id]);ui.rv=null;rerender();
  };
  const dl=app.querySelector('#rvdel');if(dl)dl.onclick=async()=>{if(!confirm('Eyða umsögninni þinni?'))return;await delRow('reviews',cid+'_'+ui.author);ui.rv=null;rerender();};
}

/* ---------- side games ---------- */
const SUGGEST=['Split the G','Fyrsta taskan á bandinu','Fyrstur á barinn','Pílukast','Lengsta teighögg dagsins','Púttkeppni á æfingaflöt'];
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'g'+Date.now()+Math.random().toString(36).slice(2));
function sidePoints(){const t={};for(const k in state.plays){const pl=state.plays[k];if(!state.games[pl.game])continue;for(const pid in (pl.scores||{}))if(P[pid])t[pid]=(t[pid]||0)+(Number(pl.scores[pid])||0);}return t;}
function gameStats(gid){const t=Object.fromEntries(PLAYERS.map(p=>[p.id,0]));const list=[];for(const k in state.plays){const pl=state.plays[k];if(pl.game!==gid)continue;list.push({id:k,...pl});for(const pid in (pl.scores||{}))if(t[pid]!=null)t[pid]+=Number(pl.scores[pid])||0;}list.sort((a,b)=>(b.at||0)-(a.at||0));return {t,list};}
async function delRow(col,id){if(col==='notes')state.notes=state.notes.filter(n=>n.id!==id);else delete state[col][id];queueDelete(col,id);}
function renderGames(){
  const games=Object.entries(state.games).map(([id,g])=>({id,...g})).sort((a,b)=>(a.at||0)-(b.at||0));
  let html=`<h2 style="margin-top:26px">Aukaleikir</h2><p class="muted small" style="margin:-4px 0 8px">Búið til leik, skráið stig og spilið hann eins oft og þið viljið. Stigin bætast við Bikarinn.</p>`;
  html+=syncHTML();
  if(ui.newGame){
    html+=`<div class="newgame"><label for="gname" class="small muted">Nafn á leik</label><input id="gname" maxlength="60" placeholder="t.d. Split the G"><div class="chips">${SUGGEST.filter(sg=>!games.some(g=>g.name.toLowerCase()===sg.toLowerCase())).map(sg=>`<button data-sug="${esc(sg)}">${esc(sg)}</button>`).join('')}</div><div class="row-btns"><button class="btn" id="gcreate">Búa til og skrá stig</button><button class="btn2" id="gcancel">Hætta við</button></div></div>`;
  } else html+=`<button class="addbtn" id="gadd">+ Bæta við leik</button>`;
  if(!games.length&&!ui.newGame) html+=`<p class="muted" style="margin-top:14px">Engir leikir ennþá. Byrjið á Split the G á fyrsta Guinness-inum.</p>`;
  games.slice().reverse().forEach(g=>{
    const {t,list}=gameStats(g.id);const max=Math.max(...Object.values(t));
    html+=`<div class="game"><div class="gh"><div><div class="gn">${esc(g.name)}</div><div class="muted small">${list.length?`spilaður ${list.length} ${list.length===1?'sinni':'sinnum'}`:'ekki spilaður ennþá'}</div></div></div>`;
    html+=`<div class="tots">${PLAYERS.map(p=>`<div class="${list.length&&t[p.id]===max&&max>0?'lead':''}"><b>${fmtNum(t[p.id])}</b>${p.name}</div>`).join('')}</div>`;
    if(ui.draft&&ui.draft.gid===g.id){
      html+=`<div class="play">${PLAYERS.map(p=>{const v=ui.draft.scores[p.id]||0;return `<div class="prow"><div class="pname">${p.name}</div><div class="step"><button data-gs="${p.id}" data-d="-1" aria-label="Færri stig hjá ${p.name}">−</button><span class="v" style="display:inline-block;line-height:44px">${v}</span><button data-gs="${p.id}" data-d="1" aria-label="Fleiri stig hjá ${p.name}">+</button></div><div class="pts">stig</div></div>`;}).join('')}<div class="row-btns"><button class="btn" id="psave">Vista umferð</button><button class="btn2" id="pcancel">Hætta við</button></div></div>`;
    } else html+=`<div class="row-btns"><button class="btn" data-play="${g.id}">${list.length?'▶ Spila aftur':'▶ Skrá stig'}</button></div>`;
    if(list.length||!(ui.draft&&ui.draft.gid===g.id)){
      html+=`<details class="hist"><summary>Saga${list.length?` (${list.length})`:''}</summary>${list.map(pl=>`<div class="hrow"><span><span class="muted">${new Date(pl.at).toLocaleString('is-IS',{weekday:'short',hour:'2-digit',minute:'2-digit'})}</span> ${PLAYERS.filter(p=>Number(pl.scores?.[p.id])).map(p=>`${p.name} ${fmtNum(Number(pl.scores[p.id]))}`).join(', ')||'engin stig'}</span><button class="linkbtn" data-delplay="${esc(pl.id)}">Eyða</button></div>`).join('')}<div style="margin-top:10px"><button class="linkbtn danger" data-delgame="${g.id}">Eyða leiknum${list.length?' og allri sögu hans':''}</button></div></details>`;
    }
    html+=`</div>`;
  });
  app.innerHTML=html;
  const add=app.querySelector('#gadd');if(add)add.onclick=()=>{ui.newGame=true;renderGames();app.querySelector('#gname').focus();};
  const gc=app.querySelector('#gcancel');if(gc)gc.onclick=()=>{ui.newGame=false;renderGames();};
  app.querySelectorAll('[data-sug]').forEach(b=>b.onclick=()=>{app.querySelector('#gname').value=b.dataset.sug;});
  const cr=app.querySelector('#gcreate');if(cr)cr.onclick=()=>{
    const name=app.querySelector('#gname').value.trim();if(!name){app.querySelector('#gname').focus();return;}
    const existing=Object.entries(state.games).find(([id,g])=>g.name.toLowerCase()===name.toLowerCase());
    let id;if(existing){id=existing[0];}else{id=uid();state.games[id]={name:name.slice(0,60),at:Date.now()};queueWrite('games',id,state.games[id]);}
    ui.newGame=false;ui.draft={gid:id,scores:{}};renderGames();
  };
  app.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{ui.draft={gid:b.dataset.play,scores:{}};renderGames();});
  app.querySelectorAll('[data-gs]').forEach(b=>b.onclick=()=>{const v=(ui.draft.scores[b.dataset.gs]||0)+Number(b.dataset.d);ui.draft.scores[b.dataset.gs]=Math.max(-10,Math.min(20,v));renderGames();});
  const pc=app.querySelector('#pcancel');if(pc)pc.onclick=()=>{ui.draft=null;renderGames();};
  const ps=app.querySelector('#psave');if(ps)ps.onclick=()=>{
    const scores={};for(const k in ui.draft.scores)if(ui.draft.scores[k])scores[k]=ui.draft.scores[k];
    const id=uid();state.plays[id]={game:ui.draft.gid,scores,at:Date.now(),by:ui.author||null};
    queueWrite('plays',id,state.plays[id]);ui.draft=null;renderGames();
  };
  app.querySelectorAll('[data-delplay]').forEach(b=>b.onclick=async()=>{if(!confirm('Eyða þessari umferð?'))return;await delRow('plays',b.dataset.delplay);renderGames();});
  app.querySelectorAll('[data-delgame]').forEach(b=>b.onclick=async()=>{
    const g=state.games[b.dataset.delgame];if(!g||!confirm(`Eyða „${g.name}“ og allri sögu hans?`))return;
    const {list}=gameStats(b.dataset.delgame);for(const pl of list)await delRow('plays',pl.id);
    await delRow('games',b.dataset.delgame);renderGames();
  });
}

function render(){
  const focusId=document.activeElement&&document.activeElement.id;
  const typing=(focusId==='nt'||focusId==='gname'||focusId==='rv')?document.activeElement.value:null;
  ({dagskra:renderSchedule,skor:renderScore,leikir:renderGames,stada:renderStandings,upplysingar:renderInfo}[ui.view]||renderSchedule)();
  document.querySelectorAll('nav.tabs a').forEach(a=>a.setAttribute('aria-current',a.dataset.v===ui.view?'page':'false'));
  if(typing!=null){const t=document.getElementById(focusId);if(t){t.value=typing;t.focus();}}
}
function route(){const h=location.hash.replace('#','');ui.view=['dagskra','skor','leikir','stada','upplysingar'].includes(h)?h:'dagskra';if(ui.view==='skor'&&!ui.hole)ui.hole=1;render();window.scrollTo(0,0);}
window.addEventListener('hashchange',route);
loadLocal();
ui.hole=firstOpenHole(R[ui.round]);
